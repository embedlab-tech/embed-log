version: 2
server:
  listen: 127.0.0.1:18080
  app_name: embed-log
  timestamp_mode: absolute
logs:
  dir: logs/
sources:
  DUT:
    label: DUT Device
    type: udp
    port: 6000
  HOST:
    label: Host Debug
    type: udp
    port: 6001
  UART_DUT:
    label: UART Main
    type: udp
    port: 6100
  UART_DEBUG:
    label: UART Debug
    type: udp
    port: 6101
  COAP_RAW:
    label: CoAP Raw Hex
    type: udp
    port: 6005
  FILE_WATCH:
    label: Watched File
    type: file
    path: .tmp/demo-watch.log
ui:
  tabs:
    - title: Device
      sources: [DUT, HOST]
    - title: UART
      sources: [UART_DUT, UART_DEBUG]
    - title: CoAP
      sources: [COAP_RAW]
    - title: File
      sources: [FILE_WATCH]
