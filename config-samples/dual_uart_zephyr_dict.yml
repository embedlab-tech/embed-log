# Two UART sources using Zephyr dictionary logging.
version: 2
server:
  listen: 127.0.0.1:18080
  app_name: Dual-board dictionary logs
logs:
  dir: logs
sources:
  NODE_A:
    label: Node A (dict log)
    type: uart
    path: /dev/ttyUSB0
    baud: 115200
    parser:
      type: zephyr-dict
      database: ../firmware/build_inside_dev/zephyr/log_dictionary.json
  NODE_B:
    label: Node B (dict log)
    type: uart
    path: /dev/ttyUSB1
    baud: 115200
    parser:
      type: zephyr-dict
      database: ../firmware/build_outside_dev/zephyr/log_dictionary.json
ui:
  tabs:
    - title: Dual Board
      sources: [NODE_A, NODE_B]
