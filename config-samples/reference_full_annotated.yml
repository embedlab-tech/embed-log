# Canonical version 2 configuration with the retained reusable settings.
version: 2
server:
  listen: 127.0.0.1:18080
  app_name: embed-log reference
  verbosity: events
  default_light_theme: whitesand
  default_dark_theme: one-dark
  timestamp_mode: absolute
  control_api: true
logs:
  dir: logs
sources:
  DUT_UART:
    label: DUT UART
    type: uart
    path: /dev/ttyUSB0
    baud: 115200
  HOST_UDP:
    label: Host UDP
    type: udp
    port: 6000
ui:
  tabs:
    - title: Device
      sources: [DUT_UART, HOST_UDP]
