[package]
name = "embed-log-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Collects UART, UDP, and file-tail logs and serves a live viewer"

[[bin]]
name = "embed-log"
path = "src/main.rs"

[package.metadata.deb]
name = "embed-log"
depends = "$auto"
copyright = "2026, krezolekcoder"
license-file = ["../../LICENSE", "0"]
assets = [
    ["target/release/embed-log", "usr/bin/", "755"],
]

[dependencies]
embed-log-core.workspace = true
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
chrono.workspace = true
serialport = "4"
regex = "1"
futures.workspace = true
tokio-tungstenite = "0.24"

[dependencies.embed-log-tui]
workspace = true
optional = true

[features]
default = ["tui"]
tui = ["dep:embed-log-tui"]

[dev-dependencies]

[build-dependencies]
chrono.workspace = true
