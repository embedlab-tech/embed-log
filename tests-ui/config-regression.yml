version: 1

server:
  host: 127.0.0.1
  ws_port: 8080
  app_name: embed-log e2e
  timestamp_mode: relative

logs:
  dir: .tmp/logs

sources:
  - name: SENSOR_A
    label: DEVICE_A
    type: udp
    port: 6000
    parser:
      type: hex-coap

  - name: SENSOR_B
    label: HOST
    type: udp
    port: 6001

  - name: SENSOR_C
    label: AUX
    type: udp
    port: 6002

  - name: SENSOR_D
    label: PYTEST
    type: udp
    port: 6004

  - name: SENSOR_COAP
    label: CoAP
    type: udp
    port: 6005
    parser:
      type: hex-coap

  # UART sources (silent — no PTY fds in test harness)
  - name: UART_DUT
    label: DUT
    type: udp
    port: 6100

  - name: UART_DEBUG
    label: DEBUG
    type: udp
    port: 6101

tabs:
  - label: DevA
    panes:
      - SENSOR_A
      - SENSOR_B

  - label: DevB
    panes: [SENSOR_C]

  - label: PYTEST
    panes: [SENSOR_D]

  - label: CoAP
    panes: [SENSOR_COAP]

  - label: UART
    panes: [UART_DUT, UART_DEBUG]
