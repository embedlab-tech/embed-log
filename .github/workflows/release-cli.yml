name: Release CLI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag recorded in artifacts, e.g. v1.0.0. Required for a branch dry run."
        required: false
        type: string
      publish_release:
        description: "Create or update the GitHub Release after all matrix jobs pass"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-cli-${{ inputs.tag || github.ref }}-publish-${{ inputs.publish_release || github.event_name == 'push' }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  test-and-package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            id: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            binary: embed-log
            deb: true
          - name: macOS Apple Silicon
            id: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
            binary: embed-log
            deb: false
          - name: macOS Intel
            id: macos-x64
            os: macos-14
            target: x86_64-apple-darwin
            archive: tar.gz
            binary: embed-log
            deb: false
          - name: Windows x64
            id: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            binary: embed-log.exe
            deb: false
    steps:
      - name: Check release tag
        shell: bash
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "RELEASE_TAG must start with v, got: $RELEASE_TAG" >&2; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Run CLI, core, and TUI tests
        run: cargo test --locked --target ${{ matrix.target }} --package embed-log-core --package embed-log-cli --package embed-log-tui

      - name: Build native release CLI
        run: cargo build --locked --release --target ${{ matrix.target }} --package embed-log-cli --bin embed-log

      - name: Align binary path for packaging scripts (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p target/release
          cp target/${{ matrix.target }}/release/embed-log target/release/embed-log

      - name: Align binary path for packaging scripts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/release
          Copy-Item -Path target/${{ matrix.target }}/release/embed-log.exe -Destination target/release/embed-log.exe

      - name: Package Unix CLI
        if: runner.os != 'Windows'
        run: ./scripts/package-cli.sh ${{ matrix.target }}

      - name: Package Windows CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-cli.ps1 -Target ${{ matrix.target }}

      - name: Build Linux .deb package
        if: matrix.deb
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build --target ${{ matrix.target }} -p embed-log-cli -o dist/embed-log-x86_64-unknown-linux-gnu.deb

      - name: Smoke-test Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          archive="dist/embed-log-${{ matrix.target }}.tar.gz"
          mkdir smoke
          tar -xzf "$archive" -C smoke
          test -x "smoke/${{ matrix.binary }}"
          "smoke/${{ matrix.binary }}" version --json

      - name: Smoke-test Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "dist/embed-log-${{ matrix.target }}.zip"
          Expand-Archive -Path $archive -DestinationPath smoke -Force
          $binary = "smoke/${{ matrix.binary }}"
          if (!(Test-Path $binary)) { throw "Archive is missing $binary" }
          & $binary version --json

      - name: Smoke-test Windows installer marker
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "embed-log-${{ matrix.target }}.zip"
          $hash = (Get-FileHash -Algorithm SHA256 -Path "dist/$archive").Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -Path dist/SHA256SUMS -NoNewline
          $installDir = Join-Path $env:RUNNER_TEMP "embed-log-installer-smoke"
          $port = 18765
          $server = Start-Process -FilePath python -ArgumentList @("-m", "http.server", "$port", "--directory", (Join-Path $PWD "dist")) -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 1
            $env:EMBED_LOG_BASE_URL = "http://127.0.0.1:$port"
            $env:INSTALL_DIR = $installDir
            $env:EMBED_LOG_NO_PROMPT = "1"
            & ./install.ps1 -NoPrompt
            if ($LASTEXITCODE -ne 0) { throw "install.ps1 failed" }
            $marker = Get-Content -Raw (Join-Path $installDir ".embed-log-install") | ConvertFrom-Json
            if ($marker.repository -ne "embedlab-tech/embed-log" -or $marker.target -ne "${{ matrix.target }}" -or $marker.executable -ne (Join-Path $installDir "embed-log.exe")) {
              throw "installer management marker did not match the installed binary"
            }
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
            Remove-Item Env:EMBED_LOG_BASE_URL -ErrorAction SilentlyContinue
            Remove-Item Env:INSTALL_DIR -ErrorAction SilentlyContinue
            Remove-Item Env:EMBED_LOG_NO_PROMPT -ErrorAction SilentlyContinue
          }

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.id }}
          path: |
            dist/embed-log-${{ matrix.target }}.${{ matrix.archive }}
            dist/embed-log-x86_64-unknown-linux-gnu.deb
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' || inputs.publish_release
    runs-on: ubuntu-latest
    needs: test-and-package
    timeout-minutes: 20
    steps:
      - name: Check release tag
        shell: bash
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "RELEASE_TAG must start with v, got: $RELEASE_TAG" >&2; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Download tested native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Add installers and checksums
        shell: bash
        run: |
          set -euo pipefail
          cp install.sh dist/install.sh
          cp install.ps1 dist/install.ps1
          chmod 755 dist/install.sh
          cd dist
          sha256sum \
            embed-log-x86_64-unknown-linux-gnu.tar.gz \
            embed-log-x86_64-unknown-linux-gnu.deb \
            embed-log-aarch64-apple-darwin.tar.gz \
            embed-log-x86_64-apple-darwin.tar.gz \
            embed-log-x86_64-pc-windows-msvc.zip \
            install.sh \
            install.ps1 > SHA256SUMS
          python3 - <<'PY'
          import json
          import os

          hashes = {}
          with open("SHA256SUMS", encoding="utf-8") as checksums:
              for line in checksums:
                  digest, name = line.strip().split(maxsplit=1)
                  hashes[name.strip()] = digest
          targets = {
              "x86_64-unknown-linux-gnu": "embed-log-x86_64-unknown-linux-gnu.tar.gz",
              "aarch64-apple-darwin": "embed-log-aarch64-apple-darwin.tar.gz",
              "x86_64-apple-darwin": "embed-log-x86_64-apple-darwin.tar.gz",
              "x86_64-pc-windows-msvc": "embed-log-x86_64-pc-windows-msvc.zip",
          }
          release = {
              "version": os.environ["RELEASE_TAG"].removeprefix("v"),
              "assets": {
                  target: {"archive": archive, "sha256": hashes[archive]}
                  for target, archive in targets.items()
              },
          }
          with open("release.json", "w", encoding="utf-8") as output:
              json.dump(release, output, separators=(",", ":"))
              output.write("\n")
          PY

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/embed-log-x86_64-unknown-linux-gnu.tar.gz
            dist/embed-log-x86_64-unknown-linux-gnu.deb
            dist/embed-log-aarch64-apple-darwin.tar.gz
            dist/embed-log-x86_64-apple-darwin.tar.gz
            dist/embed-log-x86_64-pc-windows-msvc.zip
            dist/install.sh
            dist/install.ps1
            dist/SHA256SUMS
            dist/release.json