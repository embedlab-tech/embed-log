version: 2
server:
  listen: 127.0.0.1:18080
logs:
  dir: logs
sources:
  DUT_UART:
    label: DUT UART
    type: uart
    path: /dev/ttyUSB0
    baud: 115200
  HOST_UART:
    label: Host UART
    type: uart
    path: /dev/ttyUSB1
    baud: 921600
  AUX_UDP:
    label: Auxiliary UDP
    type: udp
    port: 6002
ui:
  tabs:
    - title: Main
      sources: [DUT_UART, HOST_UART]
    - title: Auxiliary
      sources: [AUX_UDP]
